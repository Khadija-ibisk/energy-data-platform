name: CI

on:
  # Déclenchement manuel (onglet Actions > Run workflow)
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (unitaires + intégration)
        run: pytest -v
      - name: Pipeline complet
        run: PYTHONPATH=src python -m energy.pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t energy-data-platform .
